[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent-eval-pipeline"
version = "0.1.0"
description = "Offline evaluation pipeline for the Travel Booking AI Agent system. Includes Ragas/DeepEval quality scoring, A/B model testing with statistical significance, human-in-the-loop review queue, golden dataset CI/CD gates, deterministic rule-based checkers, and Grafana quality dashboards — powered by Langfuse as the data bridge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "scipy>=1.12.0",
    "langfuse>=2.30.0",
    "ragas>=0.1.10",
    "deepeval>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
